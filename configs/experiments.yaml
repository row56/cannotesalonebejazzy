    --register-span 12 --max-seed-range 12
    --max-seed-chromaticism 0.12
  note: >
    demo_selftest_free2 failed: train_v7's jazz pool is smaller than 100 eligible
    seeds. Same draws seeded from train_v6 (the model's own training set).

tonic_check:
  command: >
    python scripts/tonic_check.py
    --data data/processed/train_v6.npz
  note: >
    runs locally, no checkpoint needed. Key normalisation transposes each window
    to its estimated tonic, but the estimator is mode-agnostic and abstains on
    ambiguous windows, so a residual tonic distribution survives. Produces the
    paper's total variation distance 0.062 between the genres' tonic histograms,
    i.e. at most 53.1% balanced accuracy from the tonic alone. On train_v7 (the
    density-matched axis-fit subset) it is 0.058 / 52.9%.
