demo_selftest_matched:
  command: >
    python scripts/build_demo.py
    --ckpt /storage/runs/base_v6/best.pt
    --styles /storage/runs/base_v6/axes_dm_heldout/styles.npz
    --data /storage/data/processed/train_v7.npz
