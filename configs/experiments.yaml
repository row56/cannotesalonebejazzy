base_v6:
  base: configs/base.yaml
  script: scripts/train.py
  overrides:
    out_dir: /storage/runs/base_v6
    data: /storage/data/processed/train_v6.npz
    epochs: 200
    kl_warmup_steps: 3000
  note: >
    genre x format balanced. Jazz = pdmx_jazz (sheet) + jtd (piano performance on
    tracked beats); classical = lieder (sheet) + asap (piano performance on
    annotated beats). Every cell subsampled to the smallest, both performance
    corpora through the same skyline + melodic filter, jtd split by pianist and
